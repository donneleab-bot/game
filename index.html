    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #121a14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      background: #1e2a1e;
      border: 6px solid #3a4e3a;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 0 4px #0a100a, 0 20px 40px rgba(0, 0, 0, 0.8);
      max-width: 1400px;
      overflow-x: auto;
    }
    h1 {
      color: #e8e0c0;
      text-align: center;
      font-size: 24px;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 3px 3px 0 #1a2a1a;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #c8d0b8;
      font-size: 16px;
      font-weight: bold;
      background: #2a3a2a;
      padding: 6px 30px;
      border-radius: 20px;
      border: 2px solid #4a5e4a;
      letter-spacing: 1px;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #151a15;
      border-radius: 10px;
      padding: 10px 6px 6px 6px;
      box-shadow: 0 4px 0 #0a0f0a;
      border: 2px solid #3a4e3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
    }
    .stage-card.male { border-color: #4a6a8a; }
    .stage-card.female { border-color: #8a5a6a; }
    .stage-name {
      color: #b8c8a8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      background: #0a0f0a;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      white-space: nowrap;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 112px;
      height: 112px;
      display: block;
      background: #0a0f0a;
      border-radius: 6px;
    }
    .footer {
      text-align: center;
      color: #5a7a5a;
      font-size: 13px;
      margin-top: 20px;
      border-top: 2px solid #2a3a2a;
      padding-top: 15px;
    }
  </style>
</head>

  // ==========================================
  // 3. ФУНКЦИЯ ОТРИСОВКИ
  // ==========================================
  function drawSprite(ctx, map, palette) {
    for (let y = 0; y < map.length; y++) {
      const row = map[y];
      for (let x = 0; x < row.length; x++) {
        const colorIndex = parseInt(row[x]);
        if (colorIndex !== 0) {
          const color = palette[colorIndex];
          if (color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }
  }

  // ==========================================
  // 4. СОЗДАНИЕ КАРТОЧЕК
  // ==========================================
  function createCard(title, map, palette, gender) {
    const card = document.createElement('div');
    card.className = `stage-card ${gender}`;
    
    const nameDiv = document.createElement('div');
    nameDiv.className = 'stage-name';
    nameDiv.textContent = title;
    
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    canvas.style.width = '112px';
    canvas.style.height = '112px';
    canvas.style.imageRendering = 'pixelated';
    
    const ctx = canvas.getContext('2d');
    drawSprite(ctx, map, palette);
    
    card.appendChild(nameDiv);
    card.appendChild(canvas);
    return card;
  }

  // ==========================================
  // 5. ИНИЦИАЛИЗАЦИЯ
  // ==========================================
