            user-select: none;
        }
        body {
            background-color: #121a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e2a1e;
            border: 6px solid #3a4e3a;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 0 4px #0a100a, 0 20px 40px rgba(0,0,0,0.8);
            max-width: 1400px;
        }
        h1 {
            color: #e8e0c0;
            text-align: center;
            font-size: 24px;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }
        .label {
            text-align: center;
            color: #b8c8a8;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            background: #2a3a2a;
            padding: 4px 20px;
            border-radius: 20px;
            border: 2px solid #4a5e4a;
            display: inline-block;
        }
        .card {
            background-color: #253525;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #4a5e4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 140px;
            box-shadow: 0 6px 0 #101a10;
        }
        .card.male { border-color: #4a6a8a; }
        .card.female { border-color: #8a5a6a; }
        .card-title {
            color: #b8c8a8;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            background: #152015;
            padding: 4px 8px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
        }
        canvas {
            background-color: #1a241a;
            border-radius: 8px;
            image-rendering: pixelated;
            width: 112px;
            height: 112px;
        }
        .footer {
            text-align: center;
            color: #5a7a5a;
            font-size: 12px;
            margin-top: 20px;
            border-top: 2px solid #2a3a2a;
            padding-top: 15px;

</head>

    // ==========================================
    // 3. ФУНКЦИЯ ОТРИСОВКИ
    // ==========================================
    function drawSprite(ctx, map, palette) {
        for (let y = 0; y < map.length; y++) {
            const row = map[y];
            for (let x = 0; x < row.length; x++) {
                const colorIndex = parseInt(row[x]);
                if (colorIndex !== 0) {
                    const color = palette[colorIndex];
                    if (color) {
                        ctx.fillStyle = color;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
        }
    }

    // ==========================================
    // 4. СОЗДАНИЕ КАРТОЧЕК
    // ==========================================
    function createCard(title, map, palette, gender) {
        const card = document.createElement('div');
        card.className = `card ${gender}`;
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'card-title';
        titleDiv.textContent = title;
        
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        // Масштабируем на экране до 112px (32 * 3.5)
        canvas.style.width = '112px';
        canvas.style.height = '112px';
        canvas.style.imageRendering = 'pixelated';
        
        const ctx = canvas.getContext('2d');
        drawSprite(ctx, map, palette);
        
        card.appendChild(titleDiv);
        card.appendChild(canvas);
        return card;
    }

    // ==========================================
    // 5. ИНИЦИАЛИЗАЦИЯ СТРАНИЦЫ
