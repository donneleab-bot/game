<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест курицы от ИИ</title>
    <style>
        body {
            background: #1a2a1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            background: #2d3e2d;
            border: 4px solid #5a7a4a;
            border-radius: 10px;
            image-rendering: pixelated;
            width: 256px;
            height: 256px;
        }
    </style>
</head>
<body>
    <h2>Курица от ИИ (тест)</h2>
    <canvas id="gameCanvas" width="64" height="64"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // КОД ОТ ИИ (функция drawHen)
        // ==========================================
        function drawHen(ctx, x, y, pixelSize = 2) {
            const drawBlock = (relX, relY, width, height, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(x + relX * pixelSize, y + relY * pixelSize, width * pixelSize, height * pixelSize);
            };

            const COLORS = {
                outline: '#4A2E1B',
                body: '#EAD3A8',
                bodyShadow: '#CBB080',
                wing: '#D8BC8F',
                comb: '#D63031',
                beak: '#E67E22',
                eye: '#111111',
                legs: '#F39C12'
            };

            // 1. ГРЕБЕШОК И БОРОДКА
            drawBlock(5, 1, 3, 1, COLORS.comb);
            drawBlock(4, 2, 5, 1, COLORS.comb);
            drawBlock(3, 5, 2, 2, COLORS.comb);

            // 2. КЛЮВ
            drawBlock(1, 4, 3, 2, COLORS.beak);
            drawBlock(2, 4, 2, 1, COLORS.outline);

            // 3. ГОЛОВА И ШЕЯ
            drawBlock(4, 3, 5, 4, COLORS.body);
            drawBlock(5, 7, 4, 4, COLORS.body);
            drawBlock(8, 5, 1, 6, COLORS.bodyShadow);

            // 4. ТЕЛО
            drawBlock(5, 11, 12, 6, COLORS.body);
            drawBlock(6, 17, 10, 1, COLORS.bodyShadow);
            drawBlock(17, 10, 2, 5, COLORS.body);
            drawBlock(16, 9, 2, 2, COLORS.body);

            // 5. КРЫЛО
            drawBlock(9, 12, 6, 4, COLORS.wing);
            drawBlock(10, 13, 6, 2, COLORS.bodyShadow);

            // 6. ГЛАЗ
            drawBlock(4, 4, 1, 1, COLORS.eye);

            // 7. ЛАПКИ
            drawBlock(8, 18, 1, 3, COLORS.legs);
            drawBlock(6, 20, 3, 1, COLORS.legs);
            drawBlock(12, 18, 1, 3, COLORS.legs);
            drawBlock(10, 20, 3, 1, COLORS.legs);

            // 8. КОНТУР
            drawBlock(4, 2, 1, 1, COLORS.outline);
            drawBlock(9, 3, 1, 4, COLORS.outline);
            drawBlock(3, 3, 1, 2, COLORS.outline);
            drawBlock(3, 5, 1, 2, COLORS.outline);
            drawBlock(4, 7, 1, 4, COLORS.outline);
            drawBlock(9, 10, 8, 1, COLORS.outline);
            drawBlock(16, 8, 2, 1, COLORS.outline);
            drawBlock(18, 9, 1, 5, COLORS.outline);
            drawBlock(17, 14, 1, 2, COLORS.outline);
            drawBlock(4, 11, 2, 1, COLORS.outline);
            drawBlock(4, 12, 1, 3, COLORS.outline);
            drawBlock(5, 15, 1, 2, COLORS.outline);
            drawBlock(6, 17, 1, 1, COLORS.outline);
            drawBlock(7, 18, 4, 1, COLORS.outline);
            drawBlock(11, 18, 2, 1, COLORS.outline);
            drawBlock(13, 17, 4, 1, COLORS.outline);
            drawBlock(9, 11, 5, 1, COLORS.outline);
            drawBlock(8, 12, 1, 3, COLORS.outline);
            drawBlock(9, 15, 6, 1, COLORS.outline);
            drawBlock(15, 12, 1, 3, COLORS.outline);
        }

        // ==========================================
        // ОТРИСОВКА
        // ==========================================
        function render() {
            // Очищаем холст (фон)
            ctx.fillStyle = '#2d3e2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Центрируем курицу. 
            // Спрайт занимает ~20 пикселей в ширину (с pixelSize=2 это 40px).
            // На холсте 64x64 отступ слева и сверху примерно (64 - 40) / 2 = 12.
            // Но поскольку курица рисуется от x,y, дадим отступ 10.
            drawHen(ctx, 10, 10, 2);
        }

        render();
    </script>
</body>
</html>
