  // ==========================================
  // 3. РЕНДЕР (Строгий и четкий)
  // ==========================================
  function drawSprite(ctx, map, palette) {
    for (let y = 0; y < map.length; y++) {
      const row = map[y];
      for (let x = 0; x < row.length; x++) {
        const colorIndex = parseInt(row[x]);
        if (colorIndex !== 0) {
          const color = palette[colorIndex];
          if (color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }
    }
  }

  function createCard(title, map, palette, gender) {
    const card = document.createElement('div');
    card.className = `stage-card ${gender}`;
    
    const nameDiv = document.createElement('div');
    nameDiv.className = 'stage-name';
    nameDiv.textContent = title;
    
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    canvas.style.width = '128px';
    canvas.style.height = '128px';
    canvas.style.imageRendering = 'pixelated';
    
    const ctx = canvas.getContext('2d');
    drawSprite(ctx, map, palette);
    
    card.appendChild(nameDiv);
    card.appendChild(canvas);
    return card;
  }
