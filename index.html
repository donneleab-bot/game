      margin: 0;
      padding: 20px;
    }
    .game-container {
      background: #2d3e2d;
      border: 8px solid #5a7a4a;
      border-radius: 30px;
      padding: 30px 40px 40px 40px;
      box-shadow: 0 0 0 4px #1e2a1a, 0 20px 30px rgba(0, 0, 0, 0.5);
      max-width: 1200px;
    }
    h1 {
      color: #f0e8c0;
      text-align: center;
      font-size: 28px;
      letter-spacing: 3px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 4px 4px 0 #3a4a2a, 2px 2px 0 #7a9a5a;
      font-weight: 800;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .gender-label {
      color: #e0d8b0;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #4a5e3a;
      padding: 6px 30px;
      border-radius: 40px;
      border: 3px solid #7a9a5a;
      letter-spacing: 2px;
      box-shadow: inset 0 -4px 0 #2a3a1a;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #3a4e2e;
      border-radius: 20px;
      padding: 12px 8px 8px 8px;
      box-shadow: 0 8px 0 #1e2a14, 0 12px 12px rgba(0, 0, 0, 0.3);
      border: 3px solid #7a9a5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 130px;
      transition: transform 0.1s;
    }
    .stage-card:hover {
      transform: translateY(-5px);
    }
    .stage-card.male {

    }
    .stage-card.female {

    }
    .stage-name {

      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      background: #2a3a1e;
      padding: 4px 10px;
      border-radius: 12px;
      width: 100%;
      white-space: nowrap;
      box-shadow: inset 0 2px 0 #5a7a4a;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 112px;
      height: 112px;
      display: block;
      background: #1e2a14;
      border-radius: 10px;
      box-shadow: inset 0 0 0 3px #4a5e3a;
    }
    .footer {
      text-align: center;
      color: #9ab88a;
      font-size: 14px;
      margin-top: 20px;
      border-top: 3px solid #4a6e3a;
      padding-top: 16px;
      letter-spacing: 1px;
    }

</head>

    // ========== МАППИНГ СИМВОЛОВ В ЦВЕТА ==========
    function getColorForChar(ch, modelType) {
      // Общие символы для всех
      switch(ch) {
        case 'O': return C.outline;
        case 'A': return C.leg;
        case 'a': return C.legLight;
        case 'P': return C.roosterBeak; // клюв (оранжевый)
        case 'K': return C.black;       // глаз
        case 'W': return C.roosterWattle;
      }

      // Специфичные для модели
      if (modelType === 'egg') {
        switch(ch) {
          case 'E': return C.eggBase;
          case 'e': return C.eggShade;
          case 's': return C.eggSpot;
          default: return null;
        }
      }

      if (modelType === 'chick') {
        switch(ch) {
          case 'Y': return C.chickYellow;
          case 'y': return C.chickLight;
          case 'w': return C.chickDark;
          case 'B': return C.chickBeak;
          default: return null;
        }
      }

      // Для остальных определяем базовые цвета в зависимости от типа
      const isMale = modelType.includes('male') || modelType.includes('_m');
      const isFemale = modelType.includes('female') || modelType.includes('_f');
      const isOld = modelType.includes('old');
      const isDying = modelType.includes('dying');

      let body, dark, light, comb;

      if (isDying) {
        body = C.dyingBody; dark = C.dyingDark; light = C.dyingLight; comb = C.dyingDark;
      } else if (isOld) {
        body = C.oldBody; dark = C.oldDark; light = C.oldLight; comb = C.oldDark;
      } else if (isMale) {
        body = C.roosterBody; dark = C.roosterDark; light = C.roosterLight; comb = C.roosterComb;
      } else {
        body = C.henBody; dark = C.henDark; light = C.henLight; comb = C.henComb;
      }

      switch(ch) {
        // Тело
        case 'R': case 'M': case 'G': case 'D': return body;
        case 'r': case 'm': case 'g': case 'd': return dark;
        case 'L': case 'n': case 'h': case 'f': return light;
        // Гребень
        case 'C': return comb;
        // Хвост (для петухов)
        case 'T': return C.roosterTail;
        case 't': return C.roosterTailDark;
        case 'l': return C.roosterTailLight;
        default: return null;
      }
    }

    // ========== ОТРИСОВКА МОДЕЛИ ==========
    function renderModel(canvas, model, modelType) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let y = 0; y < SIZE; y++) {
        const row = model[y] || '';
        for (let x = 0; x < SIZE; x++) {
          const ch = row[x] || ' ';
          if (ch === ' ') continue;
          const color = getColorForChar(ch, modelType);
          if (color) {
            drawPixel(ctx, x, y, color);
          }
        }
      }
    }

    // ========== СОЗДАНИЕ DOM ЭЛЕМЕНТОВ ==========
    function createStageCard(stageName, model, modelType, genderClass) {
      const card = document.createElement('div');
      card.className = `stage-card ${genderClass}`;
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'stage-name';
      nameDiv.textContent = stageName;
      
      const canvas = document.createElement('canvas');
      canvas.width = SIZE * SCALE;
      canvas.height = SIZE * SCALE;
      canvas.style.width = '112px'; // Фиксированный размер для отображения
      canvas.style.height = '112px';
      canvas.style.imageRendering = 'pixelated';
      
      renderModel(canvas, model, modelType);
      
      card.appendChild(nameDiv);
      card.appendChild(canvas);
      return card;
    }

    const femaleStages = [

    maleStages.forEach(stage => {
