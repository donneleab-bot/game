<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Курица — High Detail</title>
    <style>
        body {
            background: #1a2a1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            background: #2d3e2d;
            border: 4px solid #5a7a4a;
            border-radius: 10px;
            image-rendering: pixelated;
            width: 256px;
            height: 256px;
        }
    </style>
</head>
<body>
    <h2>Курица (Высокая детализация)</h2>
    <canvas id="gameCanvas" width="64" height="64"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // НОВЫЙ КОД ОТ ИИ (Высокая детализация)
        // ==========================================
        function drawAdvancedHen(ctx, x, y, p = 2) {
            const block = (rx, ry, w, h, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(x + rx * p, y + ry * p, w * p, h * p);
            };

            const C = {
                outDark:  '#311E11', outMid:   '#5C3A21', outLight: '#8C5A36',
                featherLight: '#F3E5AB', featherBase:  '#D2B48C', featherShadow:'#B5946A', featherDeep:  '#8B6C47',
                wingLight: '#E6C280', wingBase: '#C49A55', wingShadow: '#967033',
                combLight: '#FF4D4D', combBase: '#C02929', combShadow:'#7A1313',
                beakLight: '#FFAD33', beakBase: '#D37506',
                legLight: '#FAB1A0', legBase: '#E67E22', legShadow: '#A75200'
            };

            // 1. ГЛУБОКИЙ ЗАДНИЙ ПЛАН
            block(15, 20, 1, 4, C.legShadow);
            block(13, 23, 3, 1, C.legShadow);
            block(23, 10, 2, 5, C.outMid);

            // 2. ГРЕБЕНЬ И БОРОДКА
            block(9, 2, 3, 1, C.combLight);
            block(12, 3, 2, 1, C.combLight);
            block(8, 3, 6, 2, C.combBase);
            block(10, 5, 4, 1, C.combShadow);
            block(7, 9, 2, 3, C.combLight);
            block(8, 10, 2, 3, C.combBase);

            // 3. КЛЮВ
            block(3, 7, 3, 1, C.beakLight);
            block(2, 8, 4, 1, C.beakBase);
            block(4, 9, 2, 1, C.outDark);

            // 4. ГОЛОВА И ШЕЯ
            block(6, 4, 7, 5, C.featherLight);
            block(7, 5, 6, 5, C.featherBase);
            block(11, 4, 3, 6, C.featherShadow);
            block(5, 9, 4, 4, C.featherLight);
            block(7, 9, 5, 5, C.featherBase);
            block(10, 10, 4, 5, C.featherShadow);

            // 5. ГЛАЗ
            block(6, 6, 1, 2, C.outDark);
            block(6, 5, 1, 1, '#FFFFFF');

            // 6. ТЕЛО
            block(4, 13, 5, 4, C.featherLight);
            block(5, 12, 16, 7, C.featherBase);
            block(8, 15, 15, 5, C.featherShadow);
            block(12, 18, 10, 3, C.featherDeep);

            // 7. ХВОСТ
            block(21, 9, 3, 3, C.featherBase);
            block(22, 11, 3, 5, C.featherShadow);
            block(20, 14, 4, 3, C.featherDeep);

            // 8. КРЫЛО
            block(10, 13, 8, 4, C.wingLight);
            block(9, 14, 9, 4, C.wingBase);
            block(11, 17, 7, 2, C.wingShadow);

            // 9. ЛАПА
            block(11, 20, 2, 4, C.legBase);
            block(11, 20, 1, 3, C.legLight);
            block(9, 23, 4, 1, C.legBase);
            block(9, 23, 2, 1, C.legLight);
            block(13, 22, 1, 1, C.legShadow);

            // 10. КОНТУР
            block(9, 3, 4, 1, C.outLight);
            block(13, 4, 1, 4, C.outLight);
            block(14, 8, 4, 1, C.outLight);
            block(18, 9, 4, 1, C.outLight);
            block(22, 8, 2, 1, C.outLight);
            block(25, 9, 1, 5, C.outMid);
            block(24, 14, 1, 3, C.outMid);
            block(4, 12, 2, 1, C.outMid);
            block(3, 13, 1, 3, C.outMid);
            block(4, 16, 1, 2, C.outDark);
            block(5, 18, 3, 1, C.outDark);
            block(8, 19, 4, 1, C.outDark);
            block(12, 21, 9, 1, C.outDark);
            block(21, 20, 2, 1, C.outDark);
            block(23, 17, 1, 3, C.outDark);
        }

        // ==========================================
        // ОТРИСОВКА
        // ==========================================
        function render() {
            ctx.fillStyle = '#2d3e2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Центрируем курицу. Спрайт занимает около 24 пикселей в ширину * 2 = 48.
            // (64 - 48) / 2 = 8.
            drawAdvancedHen(ctx, 6, 4, 2);
        }

        render();
    </script>
</body>
</html>
