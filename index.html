<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Реалистичная курица (Финальная версия)</title>
    <style>
        body {
            background: #1a2a1f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }
        canvas {
            background: #2d3e2d;
            border: 4px solid #5a7a4a;
            border-radius: 10px;
            image-rendering: pixelated;
            width: 256px;
            height: 256px;
        }
    </style>
</head>
<body>
    <h2>Курица (Анатомически правильная)</h2>
    <canvas id="gameCanvas" width="64" height="64"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ==========================================
        // ГЕНЕРАТОР РЕАЛИСТИЧНОЙ КУРИЦЫ
        // ==========================================
        function drawRealisticHen(ctx, offsetX, offsetY) {
            // Палитра с глубокой светотенью
            const colors = {
                outline: '#2A1810',      // Темный контур
                highlight: '#FFF4D4',    // Блик (свет)
                base: '#EAD3A8',         // Основной цвет
                shadow: '#CBB080',       // Полутень
                deepShadow: '#9E845A',   // Глубокая тень
                
                comb: '#E14B3B',         // Гребень
                beak: '#E67E22',         // Клюв
                eye: '#111111',          // Глаз
                leg: '#F39C12',          // Лапы
                tail: '#42352B'          // Темный хвост
            };

            // Вспомогательная функция для рисования пикселя
            const p = (x, y, color) => {
                ctx.fillStyle = color;
                ctx.fillRect(offsetX + x, offsetY + y, 1, 1);
            };

            // ==========================================
            // 1. РИСУЕМ ТЕЛО (Округлая форма с градиентом)
            // ==========================================
            
            // Основной контур тела (спина и грудь)
            // Грудь (выпуклая)
            for (let y = 8; y <= 18; y++) {
                const width = Math.sin((y - 8) / 10 * Math.PI) * 5 + 3;
                for (let x = 6 - Math.floor(width/2); x <= 6 + Math.floor(width/2); x++) {
                    p(x, y, colors.base);
                }
            }
            
            // Спина (плавный изгиб к хвосту)
            for (let x = 8; x <= 18; x++) {
                const height = Math.sin((x - 8) / 10 * Math.PI) * 3;
                for (let y = 10 - Math.floor(height); y <= 12; y++) {
                    p(x, y, colors.base);
                }
            }

            // ==========================================
            // 2. ХВОСТ (Острые перья, направленные вверх)
            // ==========================================
            // Верхнее перо
            p(17, 7, colors.tail);
            p(18, 6, colors.tail);
            p(19, 5, colors.tail);
            // Среднее перо
            p(18, 8, colors.tail);
            p(19, 7, colors.tail);
            p(20, 6, colors.tail);
            // Нижнее перо
            p(19, 9, colors.tail);
            p(20, 8, colors.tail);
            p(21, 7, colors.tail);

            // ==========================================
            // 3. ГОЛОВА И ШЕЯ (Плавный переход)
            // ==========================================
            // Шея (соединяет голову и тело)
            for (let y = 5; y <= 9; y++) {
                for (let x = 3; x <= 7; x++) {
                    p(x, y, colors.base);
                }
            }
            
            // Голова (округлая)
            for (let y = 3; y <= 6; y++) {
                for (let x = 2; x <= 7; x++) {
                    if ((x-4)*(x-4) + (y-4)*(y-4) <= 6) {
                        p(x, y, colors.base);
                    }
                }
            }

            // ==========================================
            // 4. ДЕТАЛИ (Гребень, клюв, глаз)
            // ==========================================
            // Гребень (красный, с зубчиками)
            p(4, 1, colors.comb);
            p(5, 1, colors.comb);
            p(6, 1, colors.comb);
            p(4, 2, colors.comb);
            p(5, 2, colors.comb);
            p(3, 2, colors.comb);
            
            // Клюв (треугольный)
            p(0, 4, colors.beak);
            p(1, 4, colors.beak);
            p(1, 5, colors.beak);
            p(0, 5, colors.beak); // кончик
            
            // Бородка (свисает)
            p(1, 6, colors.comb);
            p(2, 6, colors.comb);
            
            // Глаз (с бликом)
            p(3, 4, colors.eye);
            p(3, 3, '#FFFFFF'); // блик

            // ==========================================
            // 5. КРЫЛО (Слоистое)
            // ==========================================
            for (let x = 9; x <= 14; x++) {
                for (let y = 11; y <= 14; y++) {
                    p(x, y, colors.shadow);
                }
            }
            // Верхнее перо крыла
            for (let x = 9; x <= 13; x++) {
                p(x, 11, colors.highlight);
            }

            // ==========================================
            // 6. НИЖНЯЯ ЧАСТЬ ТЕЛА (Тень)
            // ==========================================
            for (let x = 5; x <= 15; x++) {
                p(x, 17, colors.shadow);
                p(x, 18, colors.deepShadow);
            }

            // ==========================================
            // 7. ЛАПЫ (Две лапы: ближняя и дальняя)
            // ==========================================
            // Ближняя лапа
            p(7, 19, colors.leg);
            p(7, 20, colors.leg);
            p(6, 21, colors.leg);
            p(7, 21, colors.leg);
            p(8, 21, colors.leg);
            // Дальняя лапа (в тени)
            p(11, 19, colors.shadow);
            p(11, 20, colors.shadow);
            p(10, 21, colors.shadow);
            p(11, 21, colors.shadow);
            p(12, 21, colors.shadow);

            // ==========================================
            // 8. КОНТУР (Обводка для четкости)
            // ==========================================
            // Контур головы
            p(2, 3, colors.outline);
            p(7, 3, colors.outline);
            p(2, 4, colors.outline);
            p(2, 5, colors.outline);
            // Контур клюва
            p(0, 3, colors.outline);
            p(1, 3, colors.outline);
            p(0, 6, colors.outline);
            // Контур спины
            p(8, 9, colors.outline);
            p(9, 9, colors.outline);
            p(10, 9, colors.outline);
            // Контур груди
            p(4, 18, colors.outline);
            p(4, 19, colors.outline);
            p(5, 20, colors.outline);
            // Контур хвоста
            p(17, 6, colors.outline);
            p(20, 5, colors.outline);
            p(21, 6, colors.outline);
            p(22, 7, colors.outline);
        }

        // ==========================================
        // ОТРИСОВКА
        // ==========================================
        function render() {
            ctx.fillStyle = '#2d3e2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Центрируем курицу на холсте 64x64
            // Спрайт занимает примерно 24x24 пикселя
            // Отступ: (64 - 24) / 2 = 20
            drawRealisticHen(ctx, 20, 20);
        }

        render();
    </script>
</body>
</html>
