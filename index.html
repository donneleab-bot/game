<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Процедурные пиксельные курицы</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #121a14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }
    .game-container {
      background: #1e2a1e;
      border: 6px solid #3a4e3a;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 0 4px #0a100a, 0 20px 40px rgba(0, 0, 0, 0.8);
      max-width: 1400px;
    }
    h1 {
      color: #e8e0c0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 3px 3px 0 #1a2a1a;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #c8d0b8;
      font-size: 16px;
      font-weight: bold;
      background: #2a3a2a;
      padding: 6px 30px;
      border-radius: 20px;
      border: 2px solid #4a5e4a;
      letter-spacing: 1px;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #253525;
      border-radius: 12px;
      padding: 10px 6px 6px 6px;
      box-shadow: 0 6px 0 #101a10;
      border: 2px solid #4a5e4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 150px;
      transition: transform 0.1s;
    }
    .stage-card:hover {
      transform: translateY(-4px);
    }
    .stage-card.male { border-color: #4a6a8a; }
    .stage-card.female { border-color: #8a5a6a; }
    .stage-name {
      color: #b8c8a8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      background: #152015;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      white-space: nowrap;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 128px;
      height: 128px;
      display: block;
      background: #0a100a;
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px #2a3a2a;
    }
    .footer {
      text-align: center;
      color: #5a7a5a;
      font-size: 13px;
      margin-top: 20px;
      border-top: 2px solid #2a3a2a;
      padding-top: 15px;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>🐔 ЭВОЛЮЦИЯ КУРИЦ (ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ) 🐔</h1>

  <div class="gender-row">
    <div class="gender-label">ПЕТУХИ (M)</div>
  </div>
  <div class="stages-row" id="maleRow"></div>

  <div class="gender-row">
    <div class="gender-label">КУРИЦЫ (Ж)</div>
  </div>
  <div class="stages-row" id="femaleRow"></div>

  <div class="footer">Алгоритмическая отрисовка 64x64 • с анимацией дыхания</div>
</div>

<script>
  // ==========================================
  // 1. НАСТРОЙКИ И ПАЛИТРЫ
  // ==========================================
  const SIZE = 64; // Используем сетку 64x64 для высокой детализации
  
  const COLORS = {
    egg: { shell: '#f4ecd8', shadow: '#d4c4a8', outline: '#8a7a5a', crack: '#a09070' },
    chick: { body: '#fce470', shadow: '#e0b830', outline: '#a07020', beak: '#f08c20', eye: '#181818' },
    hen: { body: '#f8f0e0', shadow: '#d8c8b8', outline: '#786858', comb: '#e83818', beak: '#f0a010', eye: '#181818', leg: '#e08810' },
    rooster: { body: '#d07840', shadow: '#a05020', outline: '#402010', comb: '#e83818', wattle: '#b81810', beak: '#f0a010', eye: '#181818', tail1: '#187048', tail2: '#30b070', leg: '#e08810' },
    oldHen: { body: '#d8d0c8', shadow: '#b8a898', outline: '#584840', comb: '#a02010', beak: '#c09010', eye: '#181818', leg: '#b08010' },
    oldRooster: { body: '#c0b8b0', shadow: '#988880', outline: '#483830', comb: '#a02010', wattle: '#801008', beak: '#c09010', eye: '#181818', tail1: '#406850', tail2: '#608870', leg: '#b08010' },
    dyingHen: { body: '#a89888', shadow: '#887868', outline: '#382820', comb: '#601008', beak: '#806010', eye: '#101010', leg: '#806010' },
    dyingRooster: { body: '#887868', shadow: '#685848', outline: '#281810', comb: '#601008', wattle: '#400805', beak: '#806010', eye: '#101010', tail1: '#203828', tail2: '#304838', leg: '#806010' }
  };

  // ==========================================
  // 2. АЛГОРИТМИЧЕСКИЕ ПРИМИТИВЫ
  // ==========================================
  // Вместо массивов мы рисуем фигуры, которые автоматически закрашивают пиксели.
  
  function drawPixel(ctx, x, y, color) {
    if (!color) return;
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
  }

  // Рисует эллипс с контуром и заливкой
  function drawEllipse(ctx, cx, cy, rx, ry, color, outlineColor) {
    for (let y = -ry; y <= ry; y++) {
      for (let x = -rx; x <= rx; x++) {
        const dist = (x * x) / (rx * rx) + (y * y) / (ry * ry);
        if (dist <= 1.0) {
          // Если это край эллипса, рисуем контур
          if (dist > 0.7 && outlineColor) {
            drawPixel(ctx, cx + x, cy + y, outlineColor);
          } else {
            drawPixel(ctx, cx + x, cy + y, color);
          }
        }
      }
    }
  }

  // Рисует линию (для лапок и клюва)
  function drawLine(ctx, x0, y0, x1, y1, color) {
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = (x0 < x1) ? 1 : -1;
    const sy = (y0 < y1) ? 1 : -1;
    let err = dx - dy;

    while (true) {
      drawPixel(ctx, x0, y0, color);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  // ==========================================
  // 3. ГЕНЕРАТОРЫ МОДЕЛЕЙ
  // ==========================================
  
  function generateEgg(ctx) {
    drawEllipse(ctx, 32, 34, 12, 16, COLORS.egg.shell, COLORS.egg.outline);
    // Блик
    drawEllipse(ctx, 28, 28, 3, 5, '#ffffff');
    // Тень
    drawEllipse(ctx, 34, 40, 4, 6, COLORS.egg.shadow);
  }

  function generateChick(ctx, isHatched) {
    const c = COLORS.chick;
    // Тело
    drawEllipse(ctx, 32, 36, 14, 14, c.body, c.outline);
    // Голова
    drawEllipse(ctx, 32, 22, 10, 10, c.body, c.outline);
    // Клюв
    drawPixel(ctx, 21, 22, c.beak);
    drawPixel(ctx, 20, 22, c.beak);
    drawPixel(ctx, 21, 23, c.beak);
    // Глаз
    drawPixel(ctx, 26, 20, c.eye);
    drawPixel(ctx, 27, 20, c.eye);
    // Крылышко (тень)
    drawEllipse(ctx, 38, 38, 6, 8, c.shadow);
    
    // Лапки
    drawLine(ctx, 26, 50, 26, 55, c.beak);
    drawLine(ctx, 24, 55, 28, 55, c.beak);
    
    drawLine(ctx, 38, 50, 38, 55, c.beak);
    drawLine(ctx, 36, 55, 40, 55, c.beak);

    if (isHatched) {
      // Осколки скорлупы на голове
      drawPixel(ctx, 28, 12, COLORS.egg.shell);
      drawPixel(ctx, 29, 11, COLORS.egg.outline);
      drawPixel(ctx, 34, 12, COLORS.egg.shell);
      drawPixel(ctx, 33, 11, COLORS.egg.outline);
    }
  }

  function generateAdult(ctx, type) {
    // type: 'male', 'female', 'old_male', 'old_female', 'dying_male', 'dying_female'
    const isMale = type.includes('male');
    const c = COLORS[type];

    if (isMale) {
      // Хвост петуха (рисуем до тела, чтобы он был сзади)
      // Градиентный хвост
      for (let i = 0; i < 15; i++) {
        const tx = 48 + Math.floor(i * 0.5);
        const ty = 40 - i;
        drawPixel(ctx, tx, ty, c.tail1);
        drawPixel(ctx, tx + 1, ty, c.tail2);
        drawPixel(ctx, tx - 1, ty + 1, c.tail2);
        drawPixel(ctx, tx, ty + 1, c.tail1);
        drawPixel(ctx, tx + 1, ty + 1, c.tail1);
      }
      // Тело
      drawEllipse(ctx, 32, 40, 18, 14, c.body, c.outline);
      // Шея
      drawEllipse(ctx, 26, 24, 8, 12, c.body, c.outline);
      // Голова
      drawEllipse(ctx, 24, 16, 8, 8, c.body, c.outline);
      // Гребень (Красный)
      drawEllipse(ctx, 24, 8, 6, 4, c.comb, c.outline);
      drawEllipse(ctx, 20, 9, 3, 3, c.comb, c.outline);
      drawEllipse(ctx, 28, 9, 3, 3, c.comb, c.outline);
      // Бородка
      drawEllipse(ctx, 18, 20, 3, 4, c.wattle, c.outline);
      // Клюв
      drawPixel(ctx, 15, 16, c.beak);
      drawPixel(ctx, 14, 16, c.beak);
      drawPixel(ctx, 15, 17, c.beak);
      // Глаз
      drawPixel(ctx, 20, 14, c.eye);
      drawPixel(ctx, 21, 14, c.eye);
    } else {
      // Курица
      // Тело
      drawEllipse(ctx, 32, 40, 20, 16, c.body, c.outline);
      // Шея
      drawEllipse(ctx, 24, 24, 8, 10, c.body, c.outline);
      // Голова
      drawEllipse(ctx, 22, 16, 7, 7, c.body, c.outline);
      // Гребень
      drawEllipse(ctx, 22, 8, 5, 4, c.comb, c.outline);
      drawEllipse(ctx, 18, 9, 3, 3, c.comb, c.outline);
      drawEllipse(ctx, 26, 9, 3, 3, c.comb, c.outline);
      // Клюв
      drawPixel(ctx, 14, 16, c.beak);
      drawPixel(ctx, 13, 16, c.beak);
      drawPixel(ctx, 14, 17, c.beak);
      // Глаз
      drawPixel(ctx, 18, 14, c.eye);
      drawPixel(ctx, 19, 14, c.eye);
      
      // Хвостик курицы (небольшой)
      drawEllipse(ctx, 46, 34, 6, 8, c.body, c.outline);
      drawEllipse(ctx, 48, 30, 4, 6, c.shadow);
    }

    // Лапки (общие для взрослых)
    // Левая лапка
    drawLine(ctx, 24, 52, 24, 58, c.leg);
    drawLine(ctx, 22, 58, 26, 58, c.leg);
    drawLine(ctx, 24, 58, 24, 60, c.leg);
    // Правая лапка
    drawLine(ctx, 40, 52, 40, 58, c.leg);
    drawLine(ctx, 38, 58, 42, 58, c.leg);
    drawLine(ctx, 40, 58, 40, 60, c.leg);
  }

  // ==========================================
  // 4. РЕНДЕР КАРТОЧЕК
  // ==========================================
  
  function createCard(title, type, gender) {
    const card = document.createElement('div');
    card.className = `stage-card ${gender}`;
    
    const nameDiv = document.createElement('div');
    nameDiv.className = 'stage-name';
    nameDiv.textContent = title;
    
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    
    // Очищаем и ставим фон
    ctx.fillStyle = '#0a100a';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Отрисовка в зависимости от стадии
    if (type === 'egg') {
      generateEgg(ctx);
    } else if (type === 'chick') {
      generateChick(ctx, false);
    } else if (type === 'hatch') {
      generateChick(ctx, true);
    } else {
      generateAdult(ctx, type);
    }
    
    card.appendChild(nameDiv);
    card.appendChild(canvas);
    
    // --- АНИМАЦИЯ ДЫХАНИЯ ---
    // Легкое покачивание (сдвиг на 1 пиксель по Y), чтобы оживить спрайт
    if (type !== 'egg') {
      let offset = 0;
      setInterval(() => {
        offset = offset === 0 ? 1 : 0;
        ctx.fillStyle = '#0a100a';
        ctx.fillRect(0, 0, SIZE, SIZE);
        
        ctx.save();
        ctx.translate(0, offset);
        
        if (type === 'chick') generateChick(ctx, false);
        else if (type === 'hatch') generateChick(ctx, true);
        else generateAdult(ctx, type);
        
        ctx.restore();
      }, 500);
    }
    
    return card;
  }

  // ==========================================
  // 5. ИНИЦИАЛИЗАЦИЯ
  // ==========================================
  
  const maleRow = document.getElementById('maleRow');
  const femaleRow = document.getElementById('femaleRow');

  const maleStages = [
    { name: 'ЯЙЦО', type: 'egg' },
    { name: 'ЦЫПЛЁНОК', type: 'chick' },
    { name: 'ЦЫПЛЁНОК', type: 'hatch' },
    { name: 'ПОДРОСТОК', type: 'male' },
    { name: 'ВЗРОСЛЫЙ', type: 'male' },
    { name: 'СТАРЫЙ', type: 'old_male' },
    { name: 'УМИРАЮЩИЙ', type: 'dying_male' }
  ];

  const femaleStages = [
    { name: 'ЯЙЦО', type: 'egg' },
    { name: 'ЦЫПЛЁНОК', type: 'chick' },
    { name: 'ЦЫПЛЁНОК', type: 'hatch' },
    { name: 'ПОДРОСТОК', type: 'female' },
    { name: 'ВЗРОСЛАЯ', type: 'female' },
    { name: 'СТАРАЯ', type: 'old_female' },
    { name: 'УМИРАЮЩАЯ', type: 'dying_female' }
  ];

  maleRow.innerHTML = '';
  femaleRow.innerHTML = '';

  maleStages.forEach(stage => {
    maleRow.appendChild(createCard(stage.name, stage.type, 'male'));
  });

  femaleStages.forEach(stage => {
    femaleRow.appendChild(createCard(stage.name, stage.type, 'female'));
  });

</script>
</body>
</html>
