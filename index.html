<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пиксельные курицы — 64x64 HD</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a2a1f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      background: #2d3e2d;
      border: 10px solid #5a7a4a;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 0 0 6px #1e2a1a, 0 30px 40px rgba(0, 0, 0, 0.6);
      max-width: 1400px;
      overflow-x: auto;
    }
    h1 {
      color: #f0e8c0;
      text-align: center;
      font-size: 32px;
      letter-spacing: 4px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 4px 4px 0 #3a4a2a, 2px 2px 0 #7a9a5a;
      font-weight: 800;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #e0d8b0;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      background: #4a5e3a;
      padding: 8px 40px;
      border-radius: 40px;
      border: 4px solid #7a9a5a;
      letter-spacing: 2px;
      box-shadow: inset 0 -6px 0 #2a3a1a;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }
    .stage-card {
      background: #3a4e2e;
      border-radius: 20px;
      padding: 15px 10px 10px 10px;
      box-shadow: 0 10px 0 #1e2a14, 0 15px 15px rgba(0, 0, 0, 0.4);
      border: 4px solid #7a9a5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .stage-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 18px 0 #1e2a14, 0 20px 20px rgba(0, 0, 0, 0.5);
    }
    .stage-card.male {
      border-color: #5a7a9a;
    }
    .stage-card.female {
      border-color: #9a6a7a;
    }
    .stage-name {
      color: #f0e8c0;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.5px;
      background: #2a3a1e;
      padding: 5px 10px;
      border-radius: 12px;
      width: 100%;
      white-space: nowrap;
      box-shadow: inset 0 2px 0 #5a7a4a;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 128px; /* Отображаемый размер */
      height: 128px;
      display: block;
      background: #1e2a14;
      border-radius: 12px;
      box-shadow: inset 0 0 0 4px #4a5e3a;
    }
    .footer {
      text-align: center;
      color: #9ab88a;
      font-size: 15px;
      margin-top: 20px;
      border-top: 4px solid #4a6e3a;
      padding-top: 20px;
      letter-spacing: 1px;
    }
  </style>
</head>

    // ========== МАППИНГ ЦВЕТОВ ==========
    function getColorForChar(ch, modelType) {
      switch(ch) {
        case 'O': return C.outline;
        case 'A': return C.leg;
        case 'P': return C.roosterBeak;
        case 'K': return C.black;
        case 'W': return C.roosterWattle;
      }

      if (modelType === 'egg') {
        switch(ch) {
          case 'E': return C.eggBase;
          case 'e': return C.eggShade;
          case 's': return C.eggSpot;
          default: return null;
        }
      }

      if (modelType === 'chick') {
        switch(ch) {
          case 'Y': return C.chickBase;
          case 'y': return C.chickLight;
          case 'w': return C.chickDark;
          case 'B': return C.chickBeak;
          default: return null;
        }
      }

      const isMale = modelType.includes('male') || modelType.includes('_m');
      const isFemale = modelType.includes('female') || modelType.includes('_f');
      const isOld = modelType.includes('old');
      const isDying = modelType.includes('dying');

      let body, dark, light, comb;

      if (isDying) {
        body = C.dyingBase; dark = C.dyingDark; light = C.dyingLight; comb = C.dyingDark;
      } else if (isOld) {
        body = C.oldBase; dark = C.oldDark; light = C.oldLight; comb = C.oldDark;
      } else if (isMale) {
        body = C.roosterBody; dark = C.roosterDark; light = C.roosterLight; comb = C.roosterComb;
      } else {
        body = C.henBase; dark = C.henDark; light = C.henLight; comb = C.henComb;
      }

      switch(ch) {
        case 'R': case 'M': case 'G': case 'D': return body;
        case 'r': case 'm': case 'g': case 'd': return dark;
        case 'L': case 'n': case 'h': case 'f': return light;
        case 'C': return comb;
        case 'T': return C.roosterTail;
        case 't': return C.roosterTailDark;
        case 'l': return C.roosterTailLight;
        default: return null;
      }
    }

    // ========== ОТРИСОВКА ==========
    function renderModel(canvas, model, modelType) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Заполняем фон
      ctx.fillStyle = '#1e2a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < SIZE; y++) {
        const row = model[y] || '';
        for (let x = 0; x < SIZE; x++) {
          const ch = row[x] || ' ';
          if (ch === ' ') continue;
          const color = getColorForChar(ch, modelType);
          if (color) {
            drawPixel(ctx, x, y, color);
          }
        }
      }
    }

    // ========== СОЗДАНИЕ КАРТОЧЕК ==========
    function createStageCard(stageName, model, modelType, genderClass) {
      const card = document.createElement('div');
      card.className = `stage-card ${genderClass}`;
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'stage-name';
      nameDiv.textContent = stageName;
      
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      canvas.style.width = DISPLAY_SIZE + 'px';
      canvas.style.height = DISPLAY_SIZE + 'px';
      canvas.style.imageRendering = 'pixelated';
      
      renderModel(canvas, model, modelType);
      
      card.appendChild(nameDiv);
      card.appendChild(canvas);
      return card;
    }
