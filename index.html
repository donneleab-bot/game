<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пиксельные курицы — Детальный профиль</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #121a14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      background: #1e2a1e;
      border: 6px solid #3a4e3a;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 0 4px #0a100a, 0 20px 40px rgba(0, 0, 0, 0.8);
      max-width: 1400px;
      overflow-x: auto;
    }
    h1 {
      color: #e8e0c0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 3px 3px 0 #1a2a1a;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #c8d0b8;
      font-size: 16px;
      font-weight: bold;
      background: #2a3a2a;
      padding: 6px 30px;
      border-radius: 20px;
      border: 2px solid #4a5e4a;
      letter-spacing: 1px;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #253525;
      border-radius: 12px;
      padding: 10px 6px 6px 6px;
      box-shadow: 0 6px 0 #101a10;
      border: 2px solid #4a5e4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 150px;
      transition: transform 0.1s;
    }
    .stage-card:hover {
      transform: translateY(-4px);
    }
    .stage-card.male { border-color: #4a6a8a; }
    .stage-card.female { border-color: #8a5a6a; }
    .stage-name {
      color: #b8c8a8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      background: #152015;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      white-space: nowrap;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 132px;
      height: 132px;
      display: block;
      background: #0a100a;
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px #2a3a2a;
    }
    .footer {
      text-align: center;
      color: #5a7a5a;
      font-size: 13px;
      margin-top: 20px;
      border-top: 2px solid #2a3a2a;
      padding-top: 15px;
    }
  </style>
</head>

<div class="game-container">

  <div class="gender-row">

  </div>
  <div class="stages-row" id="maleRow"></div>

    // ========== МАППИНГ ЦВЕТОВ ==========
    function getColorForChar(ch, modelType) {
      switch(ch) {
        case 'O': 
          if (modelType === 'egg') return C.eggOutline;
          if (modelType === 'chick') return C.chickOutline;
          if (modelType.includes('dying')) return C.dyingOutline;
          if (modelType.includes('old')) return C.oldOutline;
          if (modelType.includes('male')) return C.roosterOutline;
          return C.henOutline;
        case '1': 
          if (modelType === 'egg') return C.eggBase;
          if (modelType === 'chick') return C.chickLight;
          if (modelType.includes('dying')) return C.dyingLight;
          if (modelType.includes('old')) return C.oldLight;
          if (modelType.includes('male')) return C.roosterLight;
          return C.henLight;
        case '2': 
          if (modelType === 'egg') return C.eggShade;
          if (modelType === 'chick') return C.chickBase;
          if (modelType.includes('dying')) return C.dyingBody;
          if (modelType.includes('old')) return C.oldBody;
          if (modelType.includes('male')) return C.roosterBody;
          return C.henBody;
        case '3': 
          if (modelType === 'egg') return C.eggShade;
          if (modelType === 'chick') return C.chickDark;
          if (modelType.includes('dying')) return C.dyingDark;
          if (modelType.includes('old')) return C.oldDark;
          if (modelType.includes('male')) return C.roosterDark;
          return C.henDark;
        case 'T': return C.roosterTailLight;
        case 't': return C.roosterTailDark;
        case 'U': return C.roosterTail;
        case 'C': 
          if (modelType.includes('dying')) return C.dyingDark;
          if (modelType.includes('old')) return C.oldDark;
          if (modelType.includes('male')) return C.roosterComb;
          return C.henComb;
        case 'W': 
          if (modelType.includes('dying')) return C.dyingDark;
          if (modelType.includes('old')) return C.oldDark;
          if (modelType.includes('male')) return C.roosterWattle;
          return C.henComb;
        case 'E': return C.eye;
        case 'B': 
          if (modelType === 'chick') return C.chickBeak;
          if (modelType.includes('male')) return C.roosterBeak;
          return C.henBeak;
        case 'L': return C.leg;
        case 'D': return C.legDark;
        default: return null;
      }
    }

    // ========== ОТРИСОВКА ==========
    function renderModel(canvas, model, modelType) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Фон
      ctx.fillStyle = '#0a100a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < SIZE; y++) {
        const row = model[y] || '';
        for (let x = 0; x < SIZE; x++) {
          const ch = row[x] || ' ';
          if (ch === ' ') continue;
          const color = getColorForChar(ch, modelType);
          if (color) {
            drawPixel(ctx, x, y, color);
          }
        }
      }
    }

    // ========== СОЗДАНИЕ КАРТОЧЕК ==========
    function createStageCard(stageName, model, modelType, genderClass) {
      const card = document.createElement('div');
      card.className = `stage-card ${genderClass}`;
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'stage-name';
      nameDiv.textContent = stageName;
      
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      canvas.style.width = DISPLAY_SIZE + 'px';
      canvas.style.height = DISPLAY_SIZE + 'px';
      canvas.style.imageRendering = 'pixelated';
      
      renderModel(canvas, model, modelType);
      
      card.appendChild(nameDiv);
      card.appendChild(canvas);
      return card;
    }
