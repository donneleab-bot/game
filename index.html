<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пиксельные курицы — Максимальная проработка</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #121a14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }
    .game-container {
      background: #1e2a1e;
      border: 6px solid #3a4e3a;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 0 4px #0a100a, 0 20px 40px rgba(0, 0, 0, 0.8);
      max-width: 1400px;
    }
    h1 {
      color: #e8e0c0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 3px 3px 0 #1a2a1a;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #c8d0b8;
      font-size: 16px;
      font-weight: bold;
      background: #2a3a2a;
      padding: 6px 30px;
      border-radius: 20px;
      border: 2px solid #4a5e4a;
      letter-spacing: 1px;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #253525;
      border-radius: 12px;
      padding: 10px 6px 6px 6px;
      box-shadow: 0 6px 0 #101a10;
      border: 2px solid #4a5e4a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 150px;
      transition: transform 0.1s;
    }
    .stage-card:hover {
      transform: translateY(-4px);
    }
    .stage-card.male { border-color: #4a6a8a; }
    .stage-card.female { border-color: #8a5a6a; }
    .stage-name {
      color: #b8c8a8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
      background: #152015;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      white-space: nowrap;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 128px;
      height: 128px;
      display: block;
      background: #0a100a;
      border-radius: 8px;
      box-shadow: inset 0 0 0 2px #2a3a2a;
    }
    .footer {
      text-align: center;
      color: #5a7a5a;
      font-size: 13px;
      margin-top: 20px;
      border-top: 2px solid #2a3a2a;
      padding-top: 15px;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>🐔 ЭВОЛЮЦИЯ КУРИЦ (МАКСИМАЛЬНАЯ ПРОРАБОТКА) 🐔</h1>

  <div class="gender-row">
    <div class="gender-label">ПЕТУХИ (M)</div>
  </div>
  <div class="stages-row" id="maleRow"></div>

  <div class="gender-row">
    <div class="gender-label">КУРИЦЫ (Ж)</div>
  </div>
  <div class="stages-row" id="femaleRow"></div>

  <div class="footer">Процедурная генерация 64x64 • Все стадии развития</div>
</div>

<script>
  // ==========================================
  // 1. НАСТРОЙКИ И ПАЛИТРЫ
  // ==========================================
  const SIZE = 64;
  
  const COLORS = {
    egg: { shell: '#f4ecd8', shadow: '#d4c4a8', outline: '#8a7a5a', crack: '#6a5a4a', highlight: '#ffffff' },
    chick: { body: '#fce470', shadow: '#e0b830', outline: '#a07020', beak: '#f08c20', eye: '#181818', shell: '#f4ecd8' },
    hen: { body: '#f8f0e0', shadow: '#d8c8b8', outline: '#786858', comb: '#e83818', beak: '#f0a010', eye: '#181818', leg: '#e08810' },
    rooster: { body: '#d07840', shadow: '#a05020', outline: '#402010', comb: '#e83818', wattle: '#b81810', beak: '#f0a010', eye: '#181818', tail1: '#187048', tail2: '#30b070', leg: '#e08810', spur: '#a06010' },
    oldHen: { body: '#d8d0c8', shadow: '#b8a898', outline: '#584840', comb: '#a02010', beak: '#c09010', eye: '#181818', leg: '#b08010' },
    oldRooster: { body: '#c0b8b0', shadow: '#988880', outline: '#483830', comb: '#a02010', wattle: '#801008', beak: '#c09010', eye: '#181818', tail1: '#406850', tail2: '#608870', leg: '#b08010', spur: '#806010' },
    dyingHen: { body: '#a89888', shadow: '#887868', outline: '#382820', comb: '#601008', beak: '#806010', eye: '#101010', leg: '#806010' },
    dyingRooster: { body: '#887868', shadow: '#685848', outline: '#281810', comb: '#601008', wattle: '#400805', beak: '#806010', eye: '#101010', tail1: '#203828', tail2: '#304838', leg: '#806010', spur: '#604810' }
  };

  // ==========================================
  // 2. БАЗОВЫЕ ПРИМИТИВЫ
  // ==========================================
  function drawPixel(ctx, x, y, color) {
    if (!color) return;
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
  }

  function drawEllipse(ctx, cx, cy, rx, ry, color, outlineColor) {
    for (let y = -ry; y <= ry; y++) {
      for (let x = -rx; x <= rx; x++) {
        const dist = (x * x) / (rx * rx) + (y * y) / (ry * ry);
        if (dist <= 1.0) {
          if (dist > 0.7 && outlineColor) {
            drawPixel(ctx, cx + x, cy + y, outlineColor);
          } else {
            drawPixel(ctx, cx + x, cy + y, color);
          }
        }
      }
    }
  }

  function drawLine(ctx, x0, y0, x1, y1, color) {
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = (x0 < x1) ? 1 : -1;
    const sy = (y0 < y1) ? 1 : -1;
    let err = dx - dy;

    while (true) {
      drawPixel(ctx, x0, y0, color);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  // ==========================================
  // 3. ГЕНЕРАТОРЫ МОДЕЛЕЙ (ПО СТАДИЯМ)
  // ==========================================
  
  function generateEgg(ctx) {
    const c = COLORS.egg;
    // Основа
    drawEllipse(ctx, 32, 34, 14, 18, c.shell, c.outline);
    // Блик
    drawEllipse(ctx, 26, 24, 4, 6, c.highlight);
    // Тень
    drawEllipse(ctx, 36, 42, 6, 8, c.shadow);
    // Трещины (линии)
    drawLine(ctx, 32, 18, 30, 26, c.crack);
    drawLine(ctx, 30, 26, 34, 30, c.crack);
    drawLine(ctx, 34, 30, 28, 36, c.crack);
  }

  // stage: 0 - только вылупился, 1 - обычный цыпленок
  function generateChick(ctx, stage) {
    const c = COLORS.chick;
    
    if (stage === 0) {
      // Вылупившийся: мокрый, с осколками
      drawEllipse(ctx, 32, 38, 12, 12, c.body, c.outline); // Тело
      drawEllipse(ctx, 32, 24, 10, 10, c.body, c.outline); // Голова
      drawPixel(ctx, 20, 24, c.beak); drawPixel(ctx, 19, 24, c.beak); // Клюв
      drawPixel(ctx, 27, 22, c.eye); // Глаз
      // Мокрый пух (тени)
      drawEllipse(ctx, 32, 42, 8, 6, c.shadow);
      // Осколки на голове
      drawPixel(ctx, 28, 12, c.shell); drawPixel(ctx, 29, 13, c.shell);
      drawPixel(ctx, 35, 13, c.shell); drawPixel(ctx, 36, 14, c.shell);
      // Лапки
      drawLine(ctx, 26, 48, 26, 54, c.beak); drawLine(ctx, 24, 54, 28, 54, c.beak);
      drawLine(ctx, 38, 48, 38, 54, c.beak); drawLine(ctx, 36, 54, 40, 54, c.beak);
    } else {
      // Обычный цыпленок: пушистый
      drawEllipse(ctx, 32, 38, 15, 14, c.body, c.outline); // Тело
      drawEllipse(ctx, 32, 22, 11, 11, c.body, c.outline); // Голова
      drawPixel(ctx, 19, 22, c.beak); drawPixel(ctx, 18, 22, c.beak); // Клюв
      drawPixel(ctx, 26, 20, c.eye); drawPixel(ctx, 27, 20, c.eye); // Глаз
      // Крылышко
      drawEllipse(ctx, 40, 40, 6, 8, c.shadow);
      // Хвостик
      drawEllipse(ctx, 47, 34, 4, 6, c.body, c.outline);
      // Лапки
      drawLine(ctx, 26, 50, 26, 56, c.beak); drawLine(ctx, 24, 56, 28, 56, c.beak);
      drawLine(ctx, 38, 50, 38, 56, c.beak); drawLine(ctx, 36, 56, 40, 56, c.beak);
    }
  }

  // Подросток (общая база, но разный хвост)
  function generateTeen(ctx, isMale) {
    const c = isMale ? COLORS.rooster : COLORS.hen;
    
    // Тело
    drawEllipse(ctx, 32, 40, 16, 14, c.body, c.outline);
    // Шея
    drawEllipse(ctx, 24, 26, 8, 10, c.body, c.outline);
    // Голова
    drawEllipse(ctx, 22, 18, 8, 8, c.body, c.outline);
    
    // Гребень (маленький, формирующийся)
    drawEllipse(ctx, 22, 10, 4, 3, c.comb, c.outline);
    drawEllipse(ctx, 18, 11, 2, 2, c.comb, c.outline);
    
    // Клюв
    drawPixel(ctx, 13, 18, c.beak); drawPixel(ctx, 12, 18, c.beak);
    // Глаз
    drawPixel(ctx, 18, 16, c.eye); drawPixel(ctx, 19, 16, c.eye);
    
    if (isMale) {
      // Формирующийся хвост (длинные перья)
      drawEllipse(ctx, 46, 32, 6, 10, c.tail1, c.outline);
      drawEllipse(ctx, 50, 28, 4, 8, c.tail2, c.outline);
      // Бородка
      drawEllipse(ctx, 16, 22, 2, 3, c.wattle, c.outline);
    } else {
      // Хвостик курицы
      drawEllipse(ctx, 46, 34, 6, 8, c.body, c.outline);
      drawEllipse(ctx, 48, 30, 4, 5, c.shadow);
    }

    // Лапки
    drawLine(ctx, 24, 52, 24, 58, c.leg); drawLine(ctx, 22, 58, 26, 58, c.leg);
    drawLine(ctx, 40, 52, 40, 58, c.leg); drawLine(ctx, 38, 58, 42, 58, c.leg);
  }

  function generateAdult(ctx, type) {
    const isMale = type.includes('male');
    const isOld = type.includes('old');
    const isDying = type.includes('dying');
    const c = COLORS[type];

    // Сгорбленность для старых и умирающих
    const yOffset = isDying ? 4 : (isOld ? 2 : 0);
    const bodyRx = isDying ? 18 : 20;
    const bodyRy = isDying ? 12 : 16;

    if (isMale) {
      // --- ХВОСТ ПЕТУХА (пышный, градиентный) ---
      // Рисуем хвост сзади тела
      for (let i = 0; i < 20; i++) {
        const tx = 45 + Math.floor(i * 0.6);
        const ty = 42 + yOffset - i;
        drawPixel(ctx, tx, ty, c.tail1);
        drawPixel(ctx, tx + 1, ty, c.tail2);
        drawPixel(ctx, tx + 2, ty, c.tail1);
        drawPixel(ctx, tx, ty + 1, c.tail2);
        drawPixel(ctx, tx + 1, ty + 1, c.tail1);
        drawPixel(ctx, tx + 2, ty + 1, c.tail2);
      }
      
      // Тело
      drawEllipse(ctx, 32, 40 + yOffset, bodyRx, bodyRy, c.body, c.outline);
      // Шея
      drawEllipse(ctx, 24, 24 + yOffset, 9, 12, c.body, c.outline);
      // Голова (опущена у умирающих)
      drawEllipse(ctx, 22, 16 + yOffset, 9, 9, c.body, c.outline);
      
      // Гребень (огромный)
      drawEllipse(ctx, 22, 6 + yOffset, 7, 4, c.comb, c.outline);
      drawEllipse(ctx, 17, 8 + yOffset, 4, 3, c.comb, c.outline);
      drawEllipse(ctx, 27, 8 + yOffset, 4, 3, c.comb, c.outline);
      
      // Бородка
      drawEllipse(ctx, 15, 22 + yOffset, 3, 5, c.wattle, c.outline);
      
      // Клюв
      drawPixel(ctx, 13, 16 + yOffset, c.beak); drawPixel(ctx, 12, 16 + yOffset, c.beak);
      // Глаз
      drawPixel(ctx, 18, 14 + yOffset, c.eye); drawPixel(ctx, 19, 14 + yOffset, c.eye);
      
      // Крыло (тень на теле)
      drawEllipse(ctx, 38, 44 + yOffset, 8, 10, c.shadow);
      
    } else {
      // --- КУРИЦА ---
      // Тело
      drawEllipse(ctx, 32, 40 + yOffset, bodyRx, bodyRy, c.body, c.outline);
      // Шея
      drawEllipse(ctx, 24, 24 + yOffset, 8, 10, c.body, c.outline);
      // Голова
      drawEllipse(ctx, 22, 16 + yOffset, 8, 8, c.body, c.outline);
      
      // Гребень (аккуратный)
      drawEllipse(ctx, 22, 8 + yOffset, 5, 4, c.comb, c.outline);
      drawEllipse(ctx, 18, 9 + yOffset, 3, 3, c.comb, c.outline);
      
      // Клюв
      drawPixel(ctx, 13, 16 + yOffset, c.beak); drawPixel(ctx, 12, 16 + yOffset, c.beak);
      // Глаз
      drawPixel(ctx, 18, 14 + yOffset, c.eye); drawPixel(ctx, 19, 14 + yOffset, c.eye);
      
      // Хвостик
      drawEllipse(ctx, 47, 34 + yOffset, 7, 9, c.body, c.outline);
      drawEllipse(ctx, 49, 30 + yOffset, 5, 6, c.shadow);
      // Крыло
      drawEllipse(ctx, 38, 44 + yOffset, 7, 9, c.shadow);
    }

    // --- ЛАПКИ ---
    // У старых и умирающих лапки тоньше и слабее
    const legThickness = (isOld || isDying) ? 0 : 1;
    
    // Левая лапка
    drawLine(ctx, 24, 52 + yOffset, 24, 58 + yOffset, c.leg);
    if (legThickness) drawLine(ctx, 25, 52 + yOffset, 25, 58 + yOffset, c.leg);
    drawLine(ctx, 22, 58 + yOffset, 26, 58 + yOffset, c.leg);
    drawLine(ctx, 24, 58 + yOffset, 24, 60 + yOffset, c.leg);
    
    // Правая лапка
    drawLine(ctx, 40, 52 + yOffset, 40, 58 + yOffset, c.leg);
    if (legThickness) drawLine(ctx, 41, 52 + yOffset, 41, 58 + yOffset, c.leg);
    drawLine(ctx, 38, 58 + yOffset, 42, 58 + yOffset, c.leg);
    drawLine(ctx, 40, 58 + yOffset, 40, 60 + yOffset, c.leg);

    // Шпоры у петуха
    if (isMale) {
      drawPixel(ctx, 22, 56 + yOffset, c.spur);
      drawPixel(ctx, 38, 56 + yOffset, c.spur);
    }
  }

  // ==========================================
  // 4. РЕНДЕР КАРТОЧЕК С АНИМАЦИЕЙ
  // ==========================================
  
  function createCard(title, type, gender) {
    const card = document.createElement('div');
    card.className = `stage-card ${gender}`;
    
    const nameDiv = document.createElement('div');
    nameDiv.className = 'stage-name';
    nameDiv.textContent = title;
    
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    
    // Функция отрисовки конкретного типа
    const draw = () => {
      ctx.fillStyle = '#0a100a';
      ctx.fillRect(0, 0, SIZE, SIZE);
      
      if (type === 'egg') generateEgg(ctx);
      else if (type === 'chick0') generateChick(ctx, 0);
      else if (type === 'chick1') generateChick(ctx, 1);
      else if (type === 'teen_m') generateTeen(ctx, true);
      else if (type === 'teen_f') generateTeen(ctx, false);
      else generateAdult(ctx, type);
    };

    // Первичная отрисовка
    draw();
    
    // Анимация (дыхание)
    if (type !== 'egg') {
      let offset = 0;
      setInterval(() => {
        offset = offset === 0 ? 1 : 0;
        ctx.fillStyle = '#0a100a';
        ctx.fillRect(0, 0, SIZE, SIZE);
        
        ctx.save();
        ctx.translate(0, offset);
        draw();
        ctx.restore();
      }, 600);
    }
    
    card.appendChild(nameDiv);
    card.appendChild(canvas);
    return card;
  }

  // ==========================================
  // 5. ИНИЦИАЛИЗАЦИЯ
  // ==========================================
  
  const maleRow = document.getElementById('maleRow');
  const femaleRow = document.getElementById('femaleRow');

  const maleStages = [
    { name: 'ЯЙЦО', type: 'egg' },
    { name: 'ВЫЛУПИЛСЯ', type: 'chick0' },
    { name: 'ЦЫПЛЁНОК', type: 'chick1' },
    { name: 'ПОДРОСТОК', type: 'teen_m' },
    { name: 'ВЗРОСЛЫЙ', type: 'rooster' },
    { name: 'СТАРЫЙ', type: 'oldRooster' },
    { name: 'УМИРАЮЩИЙ', type: 'dyingRooster' }
  ];

  const femaleStages = [
    { name: 'ЯЙЦО', type: 'egg' },
    { name: 'ВЫЛУПИЛСЯ', type: 'chick0' },
    { name: 'ЦЫПЛЁНОК', type: 'chick1' },
    { name: 'ПОДРОСТОК', type: 'teen_f' },
    { name: 'ВЗРОСЛАЯ', type: 'hen' },
    { name: 'СТАРАЯ', type: 'oldHen' },
    { name: 'УМИРАЮЩАЯ', type: 'dyingHen' }
  ];

  maleRow.innerHTML = '';
  femaleRow.innerHTML = '';

  maleStages.forEach(stage => {
    maleRow.appendChild(createCard(stage.name, stage.type, 'male'));
  });

  femaleStages.forEach(stage => {
    femaleRow.appendChild(createCard(stage.name, stage.type, 'female'));
  });

</script>
</body>
</html>
