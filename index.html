<!DOCTYPE html>

<head>

  <title>Пиксельные курицы — Профиль</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a2a1f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
    }
    .game-container {
      background: #2d3e2d;
      border: 8px solid #5a7a4a;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 0 0 4px #1e2a1a, 0 20px 30px rgba(0, 0, 0, 0.5);
      max-width: 1300px;
      overflow-x: auto;
    }
    h1 {
      color: #f0e8c0;
      text-align: center;
      font-size: 28px;
      letter-spacing: 3px;
      margin-top: 0;
      margin-bottom: 25px;
      text-shadow: 4px 4px 0 #3a4a2a, 2px 2px 0 #7a9a5a;
      font-weight: 800;
    }
    .gender-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 15px;
    }
    .gender-label {
      color: #e0d8b0;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #4a5e3a;
      padding: 6px 30px;
      border-radius: 40px;
      border: 3px solid #7a9a5a;
      letter-spacing: 2px;
      box-shadow: inset 0 -4px 0 #2a3a1a;
    }
    .stages-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .stage-card {
      background: #3a4e2e;
      border-radius: 20px;
      padding: 12px 8px 8px 8px;
      box-shadow: 0 8px 0 #1e2a14, 0 12px 12px rgba(0, 0, 0, 0.3);
      border: 3px solid #7a9a5a;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 140px;
      transition: transform 0.1s;
    }
    .stage-card:hover {
      transform: translateY(-5px);
    }
    .stage-card.male { border-color: #5a7a9a; }
    .stage-card.female { border-color: #9a6a7a; }
    .stage-name {
      color: #f0e8c0;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: 0.5px;
      background: #2a3a1e;
      padding: 4px 10px;
      border-radius: 12px;
      width: 100%;
      white-space: nowrap;
      box-shadow: inset 0 2px 0 #5a7a4a;
    }
    canvas {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      width: 120px;
      height: 120px;
      display: block;
      background: #1e2a14; /* Темный фон, как в игре */
      border-radius: 10px;
      box-shadow: inset 0 0 0 3px #4a5e3a;
    }
    .footer {
      text-align: center;
      color: #9ab88a;
      font-size: 14px;
      margin-top: 20px;
      border-top: 3px solid #4a6e3a;
      padding-top: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>

    // ========== МАППИНГ ЦВЕТОВ ==========
    function getColorForChar(ch, modelType) {
      switch(ch) {
        case 'O': 
          if (modelType === 'egg') return C.eggOutline;
          if (modelType === 'chick') return C.chickOutline;
          if (modelType.includes('dying')) return C.dyingOutline;
          if (modelType.includes('old')) return C.oldOutline;
          if (modelType.includes('male')) return C.roosterOutline;
          return C.henOutline;
        case '1': 
          if (modelType === 'egg') return C.eggBase;
          if (modelType === 'chick') return C.chickLight;
          if (modelType.includes('dying')) return C.dyingLight;
          if (modelType.includes('old')) return C.oldLight;
          if (modelType.includes('male')) return C.roosterLight;
          return C.henLight;
        case '2': 
          if (modelType === 'egg') return C.eggShade;
          if (modelType === 'chick') return C.chickBase;
          if (modelType.includes('dying')) return C.dyingBase;
          if (modelType.includes('old')) return C.oldBase;
          if (modelType.includes('male')) return C.roosterBody;
          return C.henBase;
        case '3': 
          if (modelType === 'egg') return C.eggShade;
          if (modelType === 'chick') return C.chickDark;
          if (modelType.includes('dying')) return C.dyingDark;
          if (modelType.includes('old')) return C.oldDark;
          if (modelType.includes('male')) return C.roosterDark;
          return C.henDark;
        case 'T': return C.roosterTailLight;
        case 't': return C.roosterTailDark;
        case 'C': 
          if (modelType.includes('dying')) return C.dyingComb;
          if (modelType.includes('old')) return C.oldComb;
          if (modelType.includes('male')) return C.roosterComb;
          return C.henComb;
        case 'E': return C.henEye;
        case 'B': 
          if (modelType === 'chick') return C.chickBeak;
          if (modelType.includes('male')) return C.roosterBeak;
          return C.henBeak;
        case 'L': return C.leg;
        default: return null;
      }
    }

    // ========== ОТРИСОВКА ==========
    function renderModel(canvas, model, modelType) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Темный фон для контраста (как в игре)
      ctx.fillStyle = '#1e2a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < SIZE; y++) {
        const row = model[y] || '';
        for (let x = 0; x < SIZE; x++) {
          const ch = row[x] || ' ';
          if (ch === ' ') continue;
          const color = getColorForChar(ch, modelType);
          if (color) {
            drawPixel(ctx, x, y, color);
          }
        }
      }
    }

    // ========== СОЗДАНИЕ КАРТОЧЕК ==========
    function createStageCard(stageName, model, modelType, genderClass) {
      const card = document.createElement('div');
      card.className = `stage-card ${genderClass}`;
      
      const nameDiv = document.createElement('div');
      nameDiv.className = 'stage-name';
      nameDiv.textContent = stageName;
      
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      canvas.style.width = DISPLAY_SIZE + 'px';
      canvas.style.height = DISPLAY_SIZE + 'px';
      canvas.style.imageRendering = 'pixelated';
      
      renderModel(canvas, model, modelType);
      
      card.appendChild(nameDiv);
      card.appendChild(canvas);
      return card;
    }

    // ========== ИНИЦИАЛИЗАЦИЯ ==========

    femaleRow.innerHTML = '';

    maleStages.forEach(stage => {

    });

    femaleStages.forEach(stage => {
